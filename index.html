<!DOCTYPE html>
<html>
<head>
    <title>Cyber Password Toolkit</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: #eee;
            text-align: center;
            padding: 40px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 250px;
        }
        .result {
            margin-top: 20px;
            background: #222;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>🔐 Cyber Password Toolkit</h1>

<form method="POST">
    <input type="text" name="password" placeholder="Enter password" value="{{ password }}">
    <br>
    <button type="submit">Analyze</button>
    <button name="generate" value="1">Generate Password</button>
</form>

{% if result %}
<div class="result">
    <h3>Strength: {{ result.strength }}</h3>
    <p>Entropy: {{ result.entropy }}</p>

    <ul>
        {% for f in result.feedback %}
        <li>{{ f }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}

</body>
</html>
